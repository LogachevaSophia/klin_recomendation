name: Deploy Frontend to VM

on:
  # Автоматический запуск при мердже PR
  pull_request:
    types: [closed]
    branches:
      - main
      - master

  # Ручной запуск через GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    # Запускаем если PR был смерджен ИЛИ это ручной запуск
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: klin-recomendation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save klin-recomendation:latest | gzip > klin-recomendation.tar.gz

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        run: |
          # Копируем образ на VM
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            klin-recomendation.tar.gz $VM_USER@$VM_HOST:/tmp/

          # Деплой на VM
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'ENDSSH'
            set -e

            echo "🚀 Начало развертывания фронтенда..."

            # Загружаем Docker image
            echo "📦 Загрузка Docker образа..."
            docker load -i /tmp/klin-recomendation.tar.gz

            # Останавливаем и удаляем старый контейнер
            echo "🛑 Остановка старого контейнера..."
            docker stop klin-recomendation 2>/dev/null || true
            docker rm klin-recomendation 2>/dev/null || true

            # Запускаем новый контейнер
            echo "▶️  Запуск нового контейнера..."
            docker run -d \
              --name klin-recomendation \
              --restart unless-stopped \
              -p ${{ env.FRONTEND_PORT }}:80 \
              -e BACKEND_URL="${{ env.BACKEND_URL }}" \
              klin-recomendation:latest

            # Очищаем старые images
            docker image prune -f

            # Удаляем временный файл
            rm -f /tmp/klin-recomendation.tar.gz

            # Проверяем статус
            echo "✅ Проверка статуса контейнера..."
            docker ps | grep klin-recomendation

            echo "🎉 Развертывание завершено!"
          ENDSSH

      - name: Verify Deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          echo "📋 Последние логи контейнера:"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $VM_USER@$VM_HOST "docker logs --tail 30 klin-recomendation"

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend is now running on http://${{ secrets.VM_HOST }}:${{ secrets.FRONTEND_PORT }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          exit 1
