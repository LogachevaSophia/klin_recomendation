server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Для статических файлов (css, js, изображения) - отдаём как есть
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Для всех остальных маршрутов - отдаём index.html (клиентский роутинг)
    location / {
        try_files $uri $uri/ /index.html;
    }
}